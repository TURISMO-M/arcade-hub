<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub - Snake Menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="dark-theme">

    <a href="../index.html" class="hub-back-nav">⬅ Hub</a>
    
    <div id="player-display-name" class="top-player-name">Guest Player</div>

    <div class="settings-bar">
        <button id="open-settings-btn" class="icon-btn">⚙️ Settings</button>
    </div>

    <div class="menu-container">
        <h1 class="title">SNAKE ARENA</h1>
        <button class="menu-btn resume" id="play-btn">Play Game</button>
        <button class="menu-btn leaderboard" id="leaderboard-btn">Leaderboard</button>
        <button class="menu-btn exit" id="login-btn">Account / Auth</button>
    </div>

    <div class="bottom-ambient-glow"></div>

    <div id="authModal" class="pause-overlay">
        <div class="pause-title" id="auth-title">CREATE ACCOUNT</div>
        <div class="setting-row">
            <label>Full Name:</label>
            <input type="text" id="auth-name" placeholder="Enter full name">
        </div>
        <div class="setting-row">
            <label>Username:</label>
            <input type="text" id="auth-username" placeholder="Enter username">
        </div>
        <div class="setting-row">
            <label>Email Address:</label>
            <input type="email" id="auth-email" placeholder="email@example.com">
        </div>
        <div class="setting-row">
            <label>Password:</label>
            <input type="password" id="auth-password" placeholder="••••••••">
        </div>
        <button class="menu-btn resume" id="submit-auth-btn">Register / Sign In</button>
        <button class="menu-btn leaderboard" id="google-login-btn">Sign in with Google</button>
        <button class="menu-btn exit" id="close-auth-btn">Cancel</button>
    </div>

    <div id="settingsMenu" class="pause-overlay">
        <div class="pause-title">SETTINGS</div>
        
        <div class="settings-tab-header">ACCOUNT</div>
        <div class="setting-row">
            <label>Update Display Name:</label>
            <input type="text" id="setting-name-input" placeholder="Your Name">
        </div>
        <div class="setting-row">
            <label>Update Username:</label>
            <input type="text" id="setting-username-input" placeholder="Your Username">
        </div>
        <button class="menu-btn leaderboard" id="save-account-btn" style="width: 100%; margin-bottom: 15px;">Save Account Info</button>

        <div class="settings-tab-header">CONTROLS & THEME</div>
        <div class="setting-row">
            <label>Theme Option:</label>
            <button id="hub-theme-toggle" class="icon-btn" style="width:100%; text-align:center;">🌓 Toggle Theme</button>
        </div>

        <div class="setting-row">
            <label>Input System Type:</label>
            <select id="hub-control-type">
                <option value="dpad">On-Screen D-PAD Box</option>
                <option value="swipe">Full-Screen Touch Swipe</option>
            </select>
        </div>

        <div class="setting-row">
            <label>Controller Dimensions Scale:</label>
            <input type="range" id="hub-control-scale" min="0.6" max="1.5" step="0.05" value="1.0">
        </div>

        <div class="setting-row">
            <label>Vertical Position Move:</label>
            <input type="range" id="hub-control-y" min="0" max="150" step="5" value="15">
        </div>

        <button class="menu-btn resume" id="close-settings-btn">Save & Close</button>
    </div>

    <div id="leaderboardMenu" class="pause-overlay">
        <div class="pause-title">GLOBAL RECORDS</div>
        <div class="leaderboard-list" id="leaderboard-list">
            <div class="leaderboard-itemLoading">Fetching live records...</div>
        </div>
        <button class="menu-btn exit" id="close-leaderboard-btn">Close</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const database = firebase.database();

        const playBtn = document.getElementById('play-btn');
        const loginBtn = document.getElementById('login-btn');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const settingsMenu = document.getElementById('settingsMenu');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        
        const hubControlType = document.getElementById('hub-control-type');
        const hubControlScale = document.getElementById('hub-control-scale');
        const hubControlY = document.getElementById('hub-control-y');
        const hubThemeToggle = document.getElementById('hub-theme-toggle');

        const leaderboardMenu = document.getElementById('leaderboardMenu');
        const leaderboardList = document.getElementById('leaderboard-list');

        const playerDisplayName = document.getElementById('player-display-name');
        const authModal = document.getElementById('authModal');
        const authName = document.getElementById('auth-name');
        const authUsername = document.getElementById('auth-username');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const submitAuthBtn = document.getElementById('submit-auth-btn');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const closeAuthBtn = document.getElementById('close-auth-btn');

        const settingNameInput = document.getElementById('setting-name-input');
        const settingUsernameInput = document.getElementById('setting-username-input');
        const saveAccountBtn = document.getElementById('save-account-btn');

        function updatePlayerNameDisplay() {
            const savedName = localStorage.getItem('player_name') || 'Guest Player';
            const savedUsername = localStorage.getItem('player_username');
            playerDisplayName.textContent = savedUsername ? `${savedName} (@${savedUsername})` : savedName;
            settingNameInput.value = savedName;
            settingUsernameInput.value = savedUsername || '';
        }

        function loadGlobalSettings() {
            hubControlType.value = localStorage.getItem('control_type') || 'dpad';
            hubControlScale.value = localStorage.getItem('control_scale') || '1.0';
            hubControlY.value = localStorage.getItem('control_y') || '15';
            
            const savedTheme = localStorage.getItem('theme') || 'dark-theme';
            document.body.className = savedTheme;
            updatePlayerNameDisplay();
        }

        loginBtn.addEventListener('click', () => {
            authModal.style.display = "flex";
        });

        closeAuthBtn.addEventListener('click', () => {
            authModal.style.display = "none";
        });

        submitAuthBtn.addEventListener('click', () => {
            const name = authName.value.trim();
            const username = authUsername.value.trim();
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();

            if (!name) { alert("Please enter your name!"); return; }

            if (email && password) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(res => {
                        localStorage.setItem('player_name', name);
                        if (username) localStorage.setItem('player_username', username);
                        updatePlayerNameDisplay();
                        authModal.style.display = "none";
                    })
                    .catch(() => {
                        auth.signInWithEmailAndPassword(email, password)
                            .then(() => {
                                localStorage.setItem('player_name', name);
                                if (username) localStorage.setItem('player_username', username);
                                updatePlayerNameDisplay();
                                authModal.style.display = "none";
                            })
                            .catch(err => alert(err.message));
                    });
            } else {
                localStorage.setItem('player_name', name);
                if (username) localStorage.setItem('player_username', username);
                updatePlayerNameDisplay();
                authModal.style.display = "none";
            }
        });

        googleLoginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(result => {
                    const user = result.user;
                    localStorage.setItem('player_name', user.displayName || 'Google User');
                    updatePlayerNameDisplay();
                    authModal.style.display = "none";
                })
                .catch(err => alert(err.message));
        });

        saveAccountBtn.addEventListener('click', () => {
            const newName = settingNameInput.value.trim();
            const newUsername = settingUsernameInput.value.trim();
            if (newName) localStorage.setItem('player_name', newName);
            if (newUsername) localStorage.setItem('player_username', newUsername);
            updatePlayerNameDisplay();
            alert("Account details saved!");
        });

        playBtn.addEventListener('click', () => {
            window.location.href = "game.html";
        });

        openSettingsBtn.addEventListener('click', () => {
            loadGlobalSettings();
            settingsMenu.style.display = "flex";
        });

        closeSettingsBtn.addEventListener('click', () => {
            localStorage.setItem('control_type', hubControlType.value);
            localStorage.setItem('control_scale', hubControlScale.value);
            localStorage.setItem('control_y', hubControlY.value);
            settingsMenu.style.display = "none";
        });

        hubThemeToggle.addEventListener('click', () => {
            const body = document.body;
            if (body.classList.contains('dark-theme')) {
                body.className = 'light-theme';
                localStorage.setItem('theme', 'light-theme');
            } else {
                body.className = 'dark-theme';
                localStorage.setItem('theme', 'dark-theme');
            }
        });

        document.getElementById('leaderboard-btn').addEventListener('click', () => {
            leaderboardMenu.style.display = "flex";
        });

        document.getElementById('close-leaderboard-btn').addEventListener('click', () => {
            leaderboardMenu.style.display = "none";
        });

        // Prompt profile popup if first time signing in
        if (!localStorage.getItem('player_name')) {
            authModal.style.display = "flex";
        }

        loadGlobalSettings();
    </script>
</body>
</html>
