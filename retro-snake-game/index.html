<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub - Snake Menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="dark-theme">

    <!-- XML/SVG Back Button Icon Top Left -->
    <a href="../index.html" class="hub-back-nav" aria-label="Go Back">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="back-arrow-icon">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
    </a>

    <div id="user-badge" class="user-badge-header"></div>

    <div class="settings-bar">
        <button id="open-settings-btn" class="icon-btn">⚙️ Settings</button>
    </div>

    <div class="container" style="margin-top: 60px;">
        <div id="auth-box" style="margin-bottom: 25px;">
            <button id="login-btn" class="menu-btn resume" style="width: 210px;">Sign in with Google</button>
            <div id="player-profile" style="display: none; font-size: 16px; font-weight: bold;">
                Welcome, <span id="player-name" style="color: var(--accent-color);">Player</span>!<br>
                <span id="personal-best" style="font-size: 14px; opacity: 0.8;">Best Score: 0</span>
            </div>
        </div>

        <a href="game.html" class="game-btn">Play Snake Game</a>
        <br><br>
        <button id="hub-leaderboard-btn" class="menu-btn leaderboard" style="width: 210px; padding: 12px;">🏆 Global Leaderboard</button>
    </div>

    <div id="accountSetupModal" class="pause-overlay" style="position: fixed; z-index: 300;">
        <div class="pause-title">CREATE PROFILE</div>
        <p style="color: #ccc; font-size: 13px; text-align: center; margin-bottom: 10px;">Please complete your profile to continue.</p>
        
        <div class="setting-row">
            <label>Display Name:</label>
            <input type="text" id="setup-display-name" placeholder="Enter full name">
        </div>
        <div class="setting-row">
            <label>Username:</label>
            <input type="text" id="setup-username" placeholder="@username">
        </div>
        <button class="menu-btn resume" id="save-profile-btn" style="margin-top: 10px;">Create Profile</button>
    </div>

    <div id="leaderboardMenu" class="pause-overlay" style="position: fixed;">
        <div class="pause-title">🏆 GLOBAL TOP 5</div>
        <div class="leaderboard-list" id="leaderboard-list">
            <div class="leaderboard-itemLoading">Loading profiles...</div>
        </div>
        <button class="menu-btn exit" id="close-leaderboard-btn">Back</button>
    </div>

    <div id="settingsMenu" class="pause-overlay" style="position: fixed;">
        <div class="pause-title">⚙️ SETTINGS</div>
        
        <div class="setting-row">
            <label>Visual Interface Mode:</label>
            <button id="theme-toggle" class="icon-btn" style="width:100%; text-align:center;">🌓 Switch Theme</button>
        </div>
        <div class="setting-row">
            <label>Input Control Mapping:</label>
            <select id="control-type-select">
                <option value="dpad">On-Screen D-PAD Box</option>
                <option value="swipe">Full-Screen Touch Swipe</option>
            </select>
        </div>
        <div class="setting-row">
            <label>Controller Dimensions (Scale):</label>
            <input type="range" id="control-scale-slider" min="0.6" max="1.5" step="0.05" value="1.0">
        </div>
        <div class="setting-row">
            <label>Vertical Position Alignment:</label>
            <input type="range" id="control-y-slider" min="0" max="150" step="5" value="15">
        </div>

        <div id="account-settings-block" style="width: 90%; max-width: 240px; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; display: none;">
            <div class="pause-title" style="font-size: 16px;">ACCOUNT SETTINGS</div>
            <div class="setting-row">
                <label>Display Name:</label>
                <input type="text" id="edit-display-name">
            </div>
            <div class="setting-row">
                <label>Username:</label>
                <input type="text" id="edit-username">
            </div>
            <button class="menu-btn resume" id="save-account-btn" style="width: 100%; padding: 8px; font-size: 13px; margin-top: 5px;">Update Account</button>
            <button id="delete-account-btn" class="danger-btn" style="margin-top: 8px;">Delete Snake Account</button>
        </div>

        <div id="settings-auth-actions" style="width: 90%; max-width: 240px; text-align: center; margin-top: 15px; display: none;">
            <button id="logout-btn" style="width: 100%; background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold;">Sign Out</button>
        </div>

        <button class="menu-btn resume" id="close-settings-btn" style="margin-top: 15px;">Save & Close</button>
    </div>

    <script>
        const body = document.body;
        const settingsMenu = document.getElementById('settingsMenu');
        const themeToggle = document.getElementById('theme-toggle');
        const controlTypeSelect = document.getElementById('control-type-select');
        const controlScaleSlider = document.getElementById('control-scale-slider');
        const controlYSlider = document.getElementById('control-y-slider');
        const accountSetupModal = document.getElementById('accountSetupModal');

        function loadGlobalSettings() {
            body.className = localStorage.getItem('theme') || 'dark-theme';
            controlTypeSelect.value = localStorage.getItem('control_type') || 'dpad';
            controlScaleSlider.value = localStorage.getItem('control_scale') || '1.0';
            controlYSlider.value = localStorage.getItem('control_y') || '15';
        }

        document.getElementById('open-settings-btn').addEventListener('click', () => {
            loadGlobalSettings();
            settingsMenu.style.display = 'flex';
        });

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark-theme')) {
                body.classList.replace('dark-theme', 'light-theme');
                localStorage.setItem('theme', 'light-theme');
            } else {
                body.classList.replace('light-theme', 'dark-theme');
                localStorage.setItem('theme', 'dark-theme');
            }
        });

        document.getElementById('close-settings-btn').addEventListener('click', () => {
            localStorage.setItem('control_type', controlTypeSelect.value);
            localStorage.setItem('control_scale', controlScaleSlider.value);
            localStorage.setItem('control_y', controlYSlider.value);
            settingsMenu.style.display = 'none';
        });

        const firebaseConfig = {
            apiKey: "AIzaSyCvHb-UwPMP8QKaaAswN_pnICOCiS1VjPA",
            authDomain: "snake-arcade-e8b15.firebaseapp.com",
            databaseURL: "https://snake-arcade-e8b15-default-rtdb.firebaseio.com",
            projectId: "snake-arcade-e8b15",
            storageBucket: "snake-arcade-e8b15.firebasestorage.app",
            messagingSenderId: "854659297329",
            appId: "1:854659297329:web:3392f6f1487de3ff5ba510",
            measurementId: "G-0NQVJERB3J"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const deleteAccountBtn = document.getElementById('delete-account-btn');
        const playerProfile = document.getElementById('player-profile');
        const playerName = document.getElementById('player-name');
        const personalBestText = document.getElementById('personal-best');
        const leaderboardMenu = document.getElementById('leaderboardMenu');
        const leaderboardList = document.getElementById('leaderboard-list');
        const userBadge = document.getElementById('user-badge');
        const settingsAuthActions = document.getElementById('settings-auth-actions');
        const accountSettingsBlock = document.getElementById('account-settings-block');

        loginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            auth.signInWithPopup(provider).catch(err => {
                console.error("Authentication Error:", err.message);
            });
        });

        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                localStorage.removeItem('snake_personal_best');
                window.location.reload();
            });
        });

        deleteAccountBtn.addEventListener('click', () => {
            const user = auth.currentUser;
            if (!user) return;

            const confirmDelete = confirm("Are you sure you want to delete your Snake Game Account? This will permanently delete your profile data and high scores.");
            if (confirmDelete) {
                // Delete user database profile & high scores
                const userRef = database.ref('users/' + user.uid);
                const scoreRef = database.ref('scores/' + user.uid);

                Promise.all([userRef.remove(), scoreRef.remove()]).then(() => {
                    localStorage.removeItem('snake_personal_best');
                    alert("Your Snake Game profile and scores have been deleted.");
                    auth.signOut().then(() => {
                        window.location.reload();
                    });
                }).catch(err => {
                    alert("Error deleting account: " + err.message);
                });
            }
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                database.ref('users/' + user.uid).once('value', snapshot => {
                    const profile = snapshot.val();
                    if (!profile || !profile.username) {
                        document.getElementById('setup-display-name').value = user.displayName || '';
                        accountSetupModal.style.display = 'flex';
                    } else {
                        updateProfileUI(profile.displayName, profile.username);
                    }
                });

                loginBtn.style.display = 'none'; 
                playerProfile.style.display = 'block';
                settingsAuthActions.style.display = 'block';
                accountSettingsBlock.style.display = 'block';

                database.ref('scores/' + user.uid).on('value', snapshot => {
                    const data = snapshot.val();
                    const record = data ? data.score : 0;
                    localStorage.setItem('snake_personal_best', record);
                    personalBestText.innerText = "Best Score: " + record;
                });
            } else {
                loginBtn.style.display = 'block'; 
                playerProfile.style.display = 'none';
                userBadge.style.display = 'none';
                userBadge.innerText = '';
                settingsAuthActions.style.display = 'none';
                accountSettingsBlock.style.display = 'none';
                accountSetupModal.style.display = 'none';
            }
        });

        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const nameVal = document.getElementById('setup-display-name').value.trim();
            const usernameVal = document.getElementById('setup-username').value.trim();
            const user = auth.currentUser;

            if (!nameVal || !usernameVal) {
                alert("Please fill in both Name and Username.");
                return;
            }

            if (user) {
                database.ref('users/' + user.uid).set({
                    displayName: nameVal,
                    username: usernameVal
                }).then(() => {
                    accountSetupModal.style.display = 'none';
                    updateProfileUI(nameVal, usernameVal);
                });
            }
        });

        document.getElementById('save-account-btn').addEventListener('click', () => {
            const nameVal = document.getElementById('edit-display-name').value.trim();
            const usernameVal = document.getElementById('edit-username').value.trim();
            const user = auth.currentUser;

            if (!nameVal || !usernameVal) {
                alert("Name and Username cannot be empty.");
                return;
            }

            if (user) {
                database.ref('users/' + user.uid).update({
                    displayName: nameVal,
                    username: usernameVal
                }).then(() => {
                    updateProfileUI(nameVal, usernameVal);
                    alert("Account details updated successfully!");
                });
            }
        });

        function updateProfileUI(displayName, username) {
            playerName.innerText = displayName;
            userBadge.innerText = displayName + " (@" + username + ")";
            userBadge.style.display = 'block';

            document.getElementById('edit-display-name').value = displayName;
            document.getElementById('edit-username').value = username;
        }

        function showLeaderboard() {
            leaderboardMenu.style.display = "flex";
            leaderboardList.innerHTML = '<div class="leaderboard-itemLoading">Fetching live records...</div>';

            database.ref('scores').orderByChild('score').limitToLast(5).once('value', snapshot => {
                leaderboardList.innerHTML = "";
                let players = [];
                snapshot.forEach(childSnapshot => {
                    players.push({ uid: childSnapshot.key, ...childSnapshot.val() });
                });
                players.reverse();
                if (players.length === 0) {
                    leaderboardList.innerHTML = '<div class="leaderboard-itemLoading">No scores uploaded yet!</div>';
                    return;
                }
                players.forEach((player, index) => {
                    const item = document.createElement("div");
                    item.className = "leaderboard-item";
                    if (auth.currentUser && player.uid === auth.currentUser.uid) {
                        item.classList.add("current-player");
                    }
                    item.innerHTML = `<span>${index + 1}. ${player.name}</span><span>${player.score}</span>`;
                    leaderboardList.appendChild(item);
                });
            });
        }

        document.getElementById('hub-leaderboard-btn').addEventListener('click', showLeaderboard);
        document.getElementById('close-leaderboard-btn').addEventListener('click', () => {
            leaderboardMenu.style.display = "none";
        });

        loadGlobalSettings();
    </script>
</body>
</html>
